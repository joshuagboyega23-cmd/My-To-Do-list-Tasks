<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>My Tasks</title>
</head>
<body>
    <section class="tasks-section">
        <div class="task-header">
            <div>
                <h2>My Tasks</h2>
                <p class="subtitle">Add tasks and see what happens.</p>
            </div>
        </div>

        <form id="task-form" class="task-form">
            <div class="input-group">
                <label for="task-name">Task</label>
                <input type="text" id="task-name" placeholder="Input your task" required>
            </div>
            <div class="input-group">
                <label for="task-category">Category</label>
                <select id="task-category" required>
                    <option value="Work">Work</option>
                    <option value="Web Project">Web Project</option>
                    <option value="Personal">Personal</option>
                </select>
            </div>
            <div class="input-group">
                <label for="task-date">Due date</label>
                <input type="date" id="task-date" required>
            </div>
            <div class="input-group">
                <label for="task-priority">Priority</label>
                <select id="task-priority" required>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
            <button type="submit" class="add-btn">Add New Task</button>
        </form>

        <div class="task-container" id="list-container"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
